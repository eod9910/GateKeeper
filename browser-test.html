<!DOCTYPE html>
<html>
<head>
    <title>Browser Test for localhost:3002</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #fff; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #444; }
        .pass { border-color: green; background: #002200; }
        .fail { border-color: red; background: #220000; }
        iframe { width: 100%; height: 600px; border: 2px solid #444; margin: 20px 0; }
        #console { background: #000; padding: 10px; margin: 10px 0; max-height: 300px; overflow-y: auto; }
        .error { color: #ff4444; }
        .log { color: #44ff44; }
    </style>
</head>
<body>
    <h1>Pattern Detector Browser Test</h1>
    <div id="results"></div>
    <h2>Console Output:</h2>
    <div id="console"></div>
    <h2>Live Page Preview:</h2>
    <iframe id="testFrame" src="http://localhost:3002/"></iframe>

    <script>
        const results = document.getElementById('results');
        const consoleDiv = document.getElementById('console');
        const testFrame = document.getElementById('testFrame');

        function addTest(name, passed, details) {
            const div = document.createElement('div');
            div.className = 'test ' + (passed ? 'pass' : 'fail');
            div.innerHTML = `<strong>${passed ? '✓' : '✗'} ${name}</strong><br>${details}`;
            results.appendChild(div);
        }

        function addConsoleLog(message, isError = false) {
            const div = document.createElement('div');
            div.className = isError ? 'error' : 'log';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleDiv.appendChild(div);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        // Capture console errors from the iframe
        window.addEventListener('error', (e) => {
            addConsoleLog(`ERROR: ${e.message} at ${e.filename}:${e.lineno}`, true);
        });

        // Test page load
        testFrame.onload = function() {
            addConsoleLog('Page loaded successfully');
            
            setTimeout(() => {
                try {
                    const iframeDoc = testFrame.contentDocument || testFrame.contentWindow.document;
                    
                    // Test 1: Page loaded
                    addTest('Page Load', true, 'Page loaded without errors');
                    
                    // Test 2: Sidebar
                    const sidebar = iframeDoc.querySelector('.app-sidebar');
                    addTest('Sidebar Present', !!sidebar, sidebar ? 'Sidebar found with navigation items' : 'Sidebar not found');
                    
                    // Test 3: Chart Container
                    const chartContainer = iframeDoc.getElementById('chart-container');
                    addTest('Chart Container', !!chartContainer, chartContainer ? 'Chart container found' : 'Chart container not found');
                    
                    // Test 4: Scanner Controls
                    const indicatorSelect = iframeDoc.getElementById('scan-indicator-select');
                    addTest('Indicator Dropdown', !!indicatorSelect, indicatorSelect ? `Found with ${indicatorSelect.options.length} options` : 'Not found');
                    
                    // Test 5: Asset Class Dropdown
                    const assetClassSelect = iframeDoc.getElementById('scan-asset-class');
                    addTest('Asset Class Dropdown', !!assetClassSelect, assetClassSelect ? `Found with ${assetClassSelect.options.length} options` : 'Not found');
                    
                    // Test 6: Scan Button
                    const scanBtn = iframeDoc.getElementById('btn-scan');
                    addTest('Scan Button', !!scanBtn, scanBtn ? 'Scan button found and clickable' : 'Scan button not found');
                    
                    // Test 7: Navigation Items
                    const navItems = iframeDoc.querySelectorAll('.sidebar-nav-item');
                    addTest('Navigation Items', navItems.length > 0, `Found ${navItems.length} navigation items`);
                    
                    // Test 8: Check for error messages
                    const errorElements = iframeDoc.querySelectorAll('.error, [class*="error"]');
                    const visibleErrors = Array.from(errorElements).filter(el => {
                        return el.offsetParent !== null && !el.classList.contains('hidden');
                    });
                    addTest('No Error Messages', visibleErrors.length === 0, visibleErrors.length === 0 ? 'No visible errors' : `Found ${visibleErrors.length} error elements`);
                    
                    // Test 9: JavaScript loaded
                    const scripts = iframeDoc.querySelectorAll('script[src]');
                    addTest('JavaScript Files', scripts.length > 0, `Found ${scripts.length} script tags`);
                    
                    addConsoleLog('All tests completed');
                    
                } catch (e) {
                    addConsoleLog(`ERROR accessing iframe: ${e.message}`, true);
                    addTest('Cross-Origin Access', false, 'Cannot access iframe content (may be CORS issue)');
                }
            }, 2000);
        };

        testFrame.onerror = function(e) {
            addConsoleLog(`ERROR loading iframe: ${e}`, true);
            addTest('Page Load', false, 'Failed to load page');
        };
    </script>
</body>
</html>
